<!DOCTYPE html>
<html>
  <head>
    <title>My Product Page</title>

    <link href="//cdn-images.mailchimp.com/embedcode/classic-061523.css" rel="stylesheet">

    <style>
      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #0f172a, #020617);
        color: #e2e8f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      /* Heading */
      h1 {
        font-size: 32px;
        margin-bottom: 10px;
      }

      p {
        color: #94a3b8;
        margin-bottom: 30px;
      }

      /* Form Box */
      #mc_embed_signup {
        background: #1e293b;
        padding: 30px;
        border-radius: 15px;
        width: 350px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      }

      /* Title */
      #mc_embed_signup h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      /* Input */
      #mc_embed_signup input[type="email"] {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        margin-top: 8px;
        background: #020617;
        color: white;
      }

      /* Button */
      #mc_embed_signup input[type="submit"] {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(45deg, #2563eb, #1d4ed8);
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      .refferal_badge {
        display: none;
      }
      #mc_embed_signup input[type="text"] {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        margin-top: 8px;
        background: #020617;
        color: white;
      }
    </style>
  </head>

  <body>

    <h1>Samay premium</h1>
    <p>This is an SEO optimized product page.</p>

    <!-- Mailchimp Form -->
    <div id="mc_embed_signup">
      <form
        action="https://gmail.us19.list-manage.com/subscribe/post?u=2e7d65fcdf28eeaf58cec31ef&id=7b7f42c34a"
        method="post"
        onsubmit="setTimeout(function(){
          window.location='thankyou.html';
      }, 800);"
      >

        <h2>Subscribe</h2>

        <label>Name</label>
        <input type="text" name="FNAME" placeholder="Enter your name">

        <label>Email Address *</label>
        <input type="email" name="EMAIL" required>

        <!-- hidden anti-bot field -->
        <div style="position: absolute; left: -5000px;">
          <input type="text" name="b_2e7d65fcdf28eeaf58cec31ef_7b7f42c34a" tabindex="-1">
        </div>

        <input type="submit" value="Subscribe">

      </form>
    </div>

  </body>
</html>
